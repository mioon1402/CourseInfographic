<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터 분석 배우기 — 올인원 데이터 분석 포털</title>
<meta name="description" content="데이터를 한 번도 다뤄본 적 없는 분을 위한 데이터 분석 입문. 개념을 읽고, 그 자리에서 직접 확인하고, 바로 실습해 봅니다.">
<style>
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f2ee; --surface-3:#e9e9e3;
  --border:rgba(11,11,11,.12); --border-strong:rgba(11,11,11,.22);
  --text:#0b0b0b; --text-2:#52514e; --muted:#898781;
  --accent:#2a78d6; --accent-ink:#184f95; --accent-wash:rgba(42,120,214,.10);
  --good:#0ca30c; --good-ink:#046b04; --warn:#e08800; --crit:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s8:#e34948;
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.06);
  --shadow-lg:0 2px 4px rgba(11,11,11,.06), 0 16px 40px rgba(11,11,11,.10);
  --radius:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#222220; --surface-3:#2c2c2a;
  --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.24);
  --text:#fff; --text-2:#c3c2b7; --muted:#898781;
  --accent:#3987e5; --accent-ink:#9ec5f4; --accent-wash:rgba(57,135,229,.16);
  --good:#0ca30c; --good-ink:#5fd35f; --warn:#fab219; --crit:#e66767;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#222220; --surface-3:#2c2c2a;
  --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.24);
  --text:#fff; --text-2:#c3c2b7; --muted:#898781;
  --accent:#3987e5; --accent-ink:#9ec5f4; --accent-wash:rgba(57,135,229,.16);
  --good:#0ca30c; --good-ink:#5fd35f; --warn:#fab219; --crit:#e66767;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:78px}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:15px;line-height:1.75;word-break:keep-all}
h1,h2,h3,h4{margin:0;line-height:1.35;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;color:inherit}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
  background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* 상단바 */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1240px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;text-decoration:none;color:inherit}
.brand-mark{width:29px;height:29px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),#e87ba4);display:grid;place-items:center;color:#fff;font-size:14px}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.sp{flex:1}
.nav-link{font-size:13.5px;color:var(--text-2);text-decoration:none;padding:7px 12px;border-radius:9px;white-space:nowrap}
.nav-link:hover{background:var(--surface-2)}
.nav-link.cta{background:var(--accent);color:#fff;font-weight:650}
.nav-link.cta:hover{filter:brightness(1.08);background:var(--accent)}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;width:34px;height:34px;
  display:grid;place-items:center;cursor:pointer;font-size:14px}
.icon-btn:hover{background:var(--surface-2)}
@media (max-width:760px){ .hide-sm{display:none} }

/* 레이아웃 */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 90px;
  display:grid;grid-template-columns:246px minmax(0,1fr);gap:34px;align-items:start}
@media (max-width:940px){ .wrap{grid-template-columns:minmax(0,1fr)} .toc{display:none} }

/* 목차 */
.toc{position:sticky;top:74px;max-height:calc(100vh - 96px);overflow-y:auto;padding:22px 0 20px}
.toc-title{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.toc ol{list-style:none;margin:0;padding:0}
.toc .ch{margin-bottom:12px}
.toc .ch > a{display:block;font-size:13.5px;font-weight:700;color:var(--text);text-decoration:none;
  padding:5px 9px;border-radius:7px}
.toc .ch > a:hover{background:var(--surface-2)}
.toc .ls{list-style:none;margin:2px 0 0;padding:0 0 0 9px;border-left:2px solid var(--border)}
.toc .ls a{display:block;font-size:12.5px;color:var(--text-2);text-decoration:none;padding:3.5px 9px;border-radius:6px}
.toc .ls a:hover{background:var(--surface-2);color:var(--text)}
.toc .ls a.done{color:var(--good-ink)}
.toc .ls a.done::before{content:"✓ ";font-weight:700}

/* 히어로 */
.hero{padding:38px 0 8px;grid-column:1/-1;max-width:820px}
.hero h1{font-size:clamp(26px,4vw,38px);font-weight:700;margin-bottom:12px}
.hero p{color:var(--text-2);font-size:16px}
.hero-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.pill{background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:6px 14px;font-size:12.5px;color:var(--text-2);box-shadow:var(--shadow)}
.progress-bar{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:20px;max-width:420px}
.progress-bar i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}

/* 본문 */
main{padding-top:22px;min-width:0}
.chapter{margin-bottom:46px;scroll-margin-top:78px}
.ch-head{display:flex;align-items:baseline;gap:11px;margin-bottom:6px;flex-wrap:wrap}
.ch-num{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--accent-ink);
  background:var(--accent-wash);border-radius:999px;padding:3px 10px}
.ch-head h2{font-size:22px;font-weight:700}
.ch-desc{color:var(--text-2);font-size:14px;margin-bottom:18px;max-width:70ch}

.lesson{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:78px}
.lesson h3{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lesson h3 .n{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);
  border-radius:6px;padding:2px 7px;flex:none}
.lesson p{margin-bottom:11px;color:var(--text);font-size:14.5px}
.lesson p:last-child{margin-bottom:0}
.lesson ul,.lesson ol{margin:0 0 11px;padding-left:22px;font-size:14.5px;color:var(--text)}
.lesson li{margin-bottom:5px}
.lesson strong{font-weight:700}

.ex{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 9px 9px 0;
  padding:13px 16px;margin:12px 0;font-size:13.5px;color:var(--text-2);line-height:1.7}
.ex b{color:var(--text)}
.warnbox{background:color-mix(in srgb,var(--warn) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 42%,transparent);border-radius:10px;
  padding:12px 15px;margin:12px 0;font-size:13.5px;line-height:1.7}
.keybox{background:color-mix(in srgb,var(--good) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--good) 35%,transparent);border-radius:10px;
  padding:12px 15px;margin:12px 0;font-size:13.5px;line-height:1.7}
.keybox b{color:var(--good-ink)}

.try{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;
  padding-top:13px;border-top:1px dashed var(--border)}
.try-label{font-size:12px;color:var(--muted);font-weight:650}
.try a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;
  background:var(--accent-wash);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);
  border-radius:999px;padding:6px 14px;text-decoration:none}
.try a:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.done-btn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:999px;
  padding:6px 13px;font-size:12.5px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.done-btn:hover{border-color:var(--border-strong)}
.done-btn[aria-pressed="true"]{background:color-mix(in srgb,var(--good) 14%,transparent);
  border-color:var(--good);color:var(--good-ink);font-weight:650}

/* 인터랙티브 */
.demo{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:16px;margin:14px 0}
.demo-t{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:10px}
.demo svg{display:block;width:100%;height:auto;overflow:visible}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.ctl input[type=range]{flex:1 1 190px;accent-color:var(--accent);min-width:130px}
.readout{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent-ink);
  background:var(--accent-wash);border-radius:7px;padding:3px 10px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:7px 14px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:650}

/* 기법 카드 */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 17px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.mcard h4{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.mcard .when{font-size:12.5px;color:var(--text-2);line-height:1.6}
.mcard .read{font-size:12.5px;color:var(--text-2);line-height:1.6;
  background:var(--surface-2);border-radius:8px;padding:9px 11px}
.mcard .read b{color:var(--text)}
.mcard .trap{font-size:12.5px;line-height:1.6;color:var(--crit)}
.mcard a.go{margin-top:auto;font-size:12.5px;font-weight:650;text-decoration:none;
  color:var(--accent-ink);background:var(--accent-wash);border-radius:8px;padding:7px 11px;text-align:center}
.mcard a.go:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}

/* 심화 자료 */
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.res{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit;font-size:13.5px;
  transition:border-color .15s,transform .12s}
.res:hover{border-color:var(--accent);transform:translateY(-1px)}
.res .no{width:26px;height:26px;border-radius:7px;background:var(--accent-wash);color:var(--accent-ink);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}

.footer{grid-column:1/-1;margin-top:20px;padding-top:22px;border-top:1px solid var(--border);
  color:var(--muted);font-size:12.5px;text-align:center;line-height:1.9}
.tocbtn{display:none}
@media (max-width:940px){
  .tocbtn{display:inline-grid}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">📊</span>
      <span>데이터 분석 배우기<small>올인원 데이터 분석 포털</small></span>
    </a>
    <div class="sp"></div>
    <a class="nav-link hide-sm" href="index.html">홈</a>
    <a class="nav-link cta" href="portal.html">분석하러 가기 →</a>
    <button class="icon-btn" id="themeBtn" type="button" title="화면 밝기 전환" aria-label="화면 밝기 전환">🌗</button>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <h1>데이터를 한 번도 다뤄본 적 없어도 괜찮습니다.</h1>
    <p>수식은 쓰지 않습니다. <strong>실무에서 실제로 틀리는 지점</strong>만 골라, 왜 그런지 눈으로 확인하고
       바로 실습까지 이어지도록 만들었습니다. 순서대로 읽으시면 됩니다.</p>
    <div class="hero-meta">
      <span class="pill" id="pillCount">📘 강의 준비 중…</span>
      <span class="pill">🖐️ 직접 만져보는 예제 3개</span>
      <span class="pill">🔗 강의마다 실습 링크</span>
      <span class="pill" id="pillTime">⏱️</span>
    </div>
    <div class="progress-bar"><i id="progFill"></i></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:7px">
      <span id="progText">0 / 21 강의 완료</span> · 읽은 강의는 자동으로 기억됩니다
    </p>
  </section>

  <nav class="toc" aria-label="목차">
    <div class="toc-title">목차</div>
    <ol id="tocList"></ol>
  </nav>

  <main id="content"></main>

  <div class="footer">
    올인원 데이터 분석 포털 · 배우기<br>
    개념을 읽었다면 <a href="portal.html">분석하러 가기</a> 에서 바로 해보세요.
  </div>
</div>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 실습 링크: 해당 분석을 미리 골라 둔 채 포털을 엽니다. */
const go = (mod, label) => `<a href="portal.html?mod=${mod}&demo=1">▶ ${esc(label)}</a>`;

/* ═══════════════════════════════════════════════════════════════
   교육 콘텐츠
   ═══════════════════════════════════════════════════════════════ */
const CURRICULUM = [
{ id:'ch1', num:'1장', title:'시작하기 전에',
  desc:'분석 도구를 켜기 전에, 데이터가 무엇인지부터 정리합니다. 여기서 어긋나면 뒤가 전부 어긋납니다.',
  lessons:[
  { id:'l1-1', title:'데이터 분석이 실제로 하는 일',
    body:`<p>데이터는 <b>지나간 일의 기록</b>일 뿐입니다. 분석은 그 기록에서 되풀이되는 규칙을 찾아
      <b>다음 결정을 조금 덜 틀리게</b> 만드는 일입니다. 정답을 알려주는 마법이 아닙니다.</p>
      <p>그래서 분석 결과는 늘 이런 형태입니다. “<b>지금까지의 기록을 보면</b> 온도가 높을 때 불량이 늘었다.
      따라서 <b>아마도</b> 온도를 낮추면 도움이 될 것이다.”</p>
      <div class="ex"><b>분석으로 답할 수 없는 것</b><br>
        · 과거에 한 번도 없던 일 (신제품 첫 출시 물량)<br>
        · 기록되지 않은 것 (작업자의 컨디션, 원자재 미묘한 차이)<br>
        · 가치 판단 (“불량률과 생산량 중 뭐가 더 중요한가”)</div>
      <div class="keybox"><b>기억할 것</b> — 분석은 <b>판단을 대신해 주지 않고, 판단의 근거를 줍니다.</b></div>` },

  { id:'l1-2', title:'표(테이블)의 구조 — 행 하나가 무엇인가',
    body:`<p>분석하는 데이터는 거의 항상 <b>표</b> 형태입니다. 표에서 가장 중요한 질문은 하나입니다.
      <b>“이 표의 한 줄(행)은 무엇 하나를 뜻하는가?”</b></p>
      <ul>
        <li><b>행(row)</b> — 하나의 사건·대상. 예: “2024년 1월 3일 A라인의 하루 기록”</li>
        <li><b>열(column)</b> — 그 대상의 속성. 예: 생산량, 설비온도, 불량여부</li>
      </ul>
      <p>이게 흐릿하면 분석이 통째로 무의미해집니다. 어떤 행은 하루치, 어떤 행은 한 달치가 섞여 있으면
      평균을 내도 뜻이 없습니다.</p>
      <div class="ex"><b>좋은 예</b> — 한 행 = 하루 × 한 라인 (날짜, 라인, 생산량, 수율)<br>
        <b>나쁜 예</b> — 어떤 행은 일별, 어떤 행은 월 합계, 맨 아래엔 총계 행까지 섞임</div>
      <div class="warnbox">⚠️ 엑셀에서 흔한 실수: <b>맨 아래 “합계” 행</b>을 그대로 두고 올리는 것.
        합계 행이 하나의 데이터처럼 계산돼 결과를 왜곡합니다. 지우고 올리세요.</div>` },

  { id:'l1-3', title:'분석할 수 있는 파일 만들기 (CSV)',
    body:`<p>포털은 <b>CSV</b> 파일을 받습니다. 엑셀에서 <b>[파일] → [다른 이름으로 저장] → 형식을
      “CSV UTF-8(쉼표로 분리)”</b> 로 고르면 됩니다. 한글이 깨질까 걱정하지 않으셔도 됩니다 —
      포털이 한국 엑셀 형식(cp949)도 자동으로 알아봅니다.</p>
      <p>다음 다섯 가지만 지키면 대부분의 문제가 사라집니다.</p>
      <ol>
        <li><b>첫 줄은 컬럼 이름</b> — 제목이나 로고, 설명 줄이 위에 있으면 안 됩니다.</li>
        <li><b>병합된 셀 없애기</b> — 표에서 병합 셀은 빈칸으로 바뀝니다.</li>
        <li><b>한 칸에 한 값</b> — <code>25℃/60%</code> 처럼 두 값을 한 칸에 넣지 마세요.</li>
        <li><b>숫자 칸에는 숫자만</b> — <code>측정불가</code>, <code>-</code>, <code>N/A</code> 는 그냥 <b>빈칸</b>으로 두세요.</li>
        <li><b>한 시트에 표 하나</b> — 여러 표가 나란히 있으면 인식되지 않습니다.</li>
      </ol>
      <div class="keybox"><b>확신이 안 서면</b> 포털의 <b>데이터 품질 진단</b>을 먼저 돌려 보세요.
        무엇이 잘못됐는지 점수와 목록으로 알려 줍니다.</div>`,
    try:[['data_quality','데이터 품질 진단 해보기']] },
]},

{ id:'ch2', num:'2장', title:'숫자를 읽는 눈',
  desc:'평균 하나만 보고 결정하다 사고가 납니다. 숫자 하나 뒤에 숨은 것을 보는 법입니다.',
  lessons:[
  { id:'l2-1', title:'평균의 함정 — 직접 확인해 보세요',
    body:`<p>아래는 어느 팀 10명의 월급입니다. <b>맨 오른쪽 한 사람의 월급만</b> 슬라이더로 바꿔 보세요.
      평균(파란 선)과 중앙값(초록 선)이 어떻게 다르게 움직이는지 보십시오.</p>
      <div class="demo">
        <div class="demo-t">팀원 10명의 월급 (만원)</div>
        <svg id="meanSvg" viewBox="0 0 600 190" role="img" aria-label="평균과 중앙값 비교 그래프"></svg>
        <div class="ctl">
          <label for="meanSlider" style="flex:none">한 사람의 월급</label>
          <input type="range" id="meanSlider" min="300" max="5000" step="50" value="400">
          <span class="readout" id="meanOut"></span>
        </div>
      </div>
      <p><b>평균</b>은 한 명의 극단값에 크게 끌려갑니다. <b>중앙값</b>(줄 세웠을 때 한가운데 값)은
      거의 움직이지 않습니다.</p>
      <div class="ex"><b>실무에서</b> — “우리 팀 평균 연봉은 높습니다”가 사실이어도, 대다수는 그보다 훨씬 적게
        받을 수 있습니다. 처리시간·수리비·체류시간처럼 <b>한쪽으로 긴 꼬리가 있는 값</b>은 반드시
        중앙값을 함께 보세요.</div>
      <div class="keybox"><b>기억할 것</b> — 값이 한쪽으로 쏠려 있으면 <b>평균보다 중앙값</b>이 현실에 가깝습니다.</div>`,
    try:[['eda_summary','내 데이터의 평균·중앙값 보기']] },

  { id:'l2-2', title:'평균이 같아도 전혀 다른 데이터',
    body:`<p>두 설비의 평균 수율이 똑같이 95%라고 해봅시다. 그런데 A설비는 매일 94~96%,
      B설비는 어떤 날은 80%, 어떤 날은 100%입니다. 평균은 같지만 <b>완전히 다른 상황</b>입니다.</p>
      <p>이 “들쭉날쭉한 정도”를 <b>표준편차</b>라고 부릅니다. 클수록 예측하기 어렵고 관리가 안 되는 상태입니다.</p>
      <div class="ex"><b>왜 중요한가</b> — 평균 95%인 B설비는 언젠가 80%인 날이 또 옵니다.
        고객 납기를 맞추려면 <b>평균이 아니라 나쁜 날 기준</b>으로 계획해야 합니다.</div>
      <div class="keybox"><b>기억할 것</b> — 평균은 “보통 어디쯤”, 표준편차는 “얼마나 흔들리는지”.
        <b>둘을 항상 같이 보세요.</b></div>`,
    try:[['spc_control','공정이 얼마나 흔들리는지 보기']] },

  { id:'l2-3', title:'이상치 — 지울 것인가, 봐야 할 것인가',
    body:`<p>다른 값들과 동떨어진 값을 <b>이상치</b>라고 합니다. 초보자가 가장 많이 하는 실수는
      <b>이상치를 발견하자마자 지우는 것</b>입니다.</p>
      <ul>
        <li><b>지워야 하는 이상치</b> — 입력 실수. 체온 <code>365</code>℃, 나이 <code>999</code>세.</li>
        <li><b>절대 지우면 안 되는 이상치</b> — 진짜로 일어난 사건. 설비가 실제로 튄 그날의 기록.</li>
      </ul>
      <p>대부분의 경우 <b>이상치가 바로 우리가 찾던 것</b>입니다. 불량이 난 날, 사고가 난 순간이
      이상치로 나타납니다. 그걸 지우면 분석할 이유 자체가 사라집니다.</p>
      <div class="warnbox">⚠️ 판단이 안 서면 <b>지우지 말고 표시만</b> 하세요. 포털의 품질 진단에서
        이상치 처리를 “표시만 하기”로 두는 것이 기본값인 이유입니다.</div>`,
    try:[['anomaly_iforest','이상치 찾아보기']] },

  { id:'l2-4', title:'비율의 함정 — 분모를 보세요',
    body:`<p>“C라인 불량률 100%!” — 그런데 그날 C라인은 <b>2개만 생산</b>했고 2개가 불량이었습니다.
      A라인은 10,000개 중 300개 불량으로 3%입니다. 어느 쪽이 더 급한 문제일까요?</p>
      <p>비율은 <b>분모가 작으면 미친 듯이 흔들립니다.</b> 비율만 보고 순위를 매기면 거의 항상
      “표본이 적은 것”이 1등이 됩니다.</p>
      <div class="ex"><b>실무 규칙</b> — 비율을 볼 때는 <b>항상 건수를 옆에 같이</b> 두세요.
        분모가 30 미만이면 비율을 신뢰하지 마세요.</div>
      <div class="keybox"><b>기억할 것</b> — 퍼센트만 있는 표는 위험합니다. <b>분모(건수)를 요구하세요.</b></div>`,
    try:[['pareto','건수 기준으로 우선순위 보기']] },

  { id:'l2-5', title:'데이터가 적으면 아무 말도 할 수 없습니다',
    body:`<p>동전을 4번 던져 앞면이 3번 나왔다고 “이 동전은 앞면이 잘 나온다”고 할 수 없습니다.
      우연히 그럴 확률이 충분히 높기 때문입니다.</p>
      <p>데이터 분석도 같습니다. <b>같은 데이터라도 개수가 적으면 결론을 못 냅니다.</b>
      분석 도구는 데이터가 적어도 어떻게든 숫자를 뱉어내므로, 사람이 조심해야 합니다.</p>
      <div class="ex"><b>대략의 기준</b><br>
        · 그룹 비교: 각 그룹 최소 30건 (적을수록 큰 차이만 감지 가능)<br>
        · 예측 모델: 최소 수백 건, 항목 수의 10배 이상<br>
        · 시계열 예측: 계절 패턴을 보려면 최소 2주기 (연간 패턴 → 2년치)</div>
      <div class="keybox"><b>기억할 것</b> — 결론이 안 나는 것도 정당한 결론입니다.
        “<b>지금 데이터로는 알 수 없다</b>”고 말할 수 있어야 합니다.</div>` },
]},

{ id:'ch3', num:'3장', title:'관계를 읽는 눈',
  desc:'“A 때문에 B다”라고 말하려면 무엇이 필요한지. 실무에서 가장 많은 오판이 나오는 영역입니다.',
  lessons:[
  { id:'l3-1', title:'상관관계란 무엇인가 — 직접 움직여 보세요',
    body:`<p>두 값이 얼마나 함께 움직이는지를 <b>-1 ~ +1</b> 사이 숫자로 나타낸 것이 <b>상관계수</b>입니다.
      슬라이더를 움직여 점들이 어떻게 변하는지 보세요.</p>
      <div class="demo">
        <div class="demo-t">설비온도(가로) 와 불량률(세로)</div>
        <svg id="corrSvg" viewBox="0 0 600 260" role="img" aria-label="상관관계 산점도"></svg>
        <div class="ctl">
          <label for="corrSlider" style="flex:none">상관계수</label>
          <input type="range" id="corrSlider" min="-100" max="100" step="5" value="70">
          <span class="readout" id="corrOut"></span>
        </div>
      </div>
      <ul>
        <li><b>+1 에 가까움</b> — 하나가 오르면 다른 것도 같이 오름</li>
        <li><b>0 근처</b> — 서로 상관없음 (점들이 구름처럼 퍼짐)</li>
        <li><b>-1 에 가까움</b> — 하나가 오르면 다른 것은 내려감</li>
      </ul>
      <div class="warnbox">⚠️ 상관계수는 <b>직선 관계만</b> 잡아냅니다. “적당한 온도에서 가장 좋고 너무
        낮거나 높으면 나쁜” U자 관계는 상관계수가 0에 가깝게 나옵니다. <b>그래프를 꼭 눈으로 보세요.</b></div>`,
    try:[['eda_corr','내 데이터의 상관관계 보기']] },

  { id:'l3-2', title:'상관관계는 인과관계가 아닙니다',
    body:`<p>이 문장은 데이터 분석에서 가장 많이 인용되고, 가장 많이 무시됩니다.</p>
      <p>아이스크림 판매량과 익사 사고는 강한 상관관계가 있습니다. 아이스크림이 익사를 부를까요?
      아닙니다. <b>여름</b>이라는 제3의 원인이 둘 다를 끌어올린 것입니다.</p>
      <p>A와 B가 함께 움직일 때 가능한 설명은 최소 네 가지입니다.</p>
      <ol>
        <li>A가 B의 원인이다</li>
        <li>B가 A의 원인이다 <span style="color:var(--muted)">(방향이 반대일 수 있습니다)</span></li>
        <li>C가 A와 B 둘 다의 원인이다 <span style="color:var(--muted)">(숨은 변수)</span></li>
        <li>우연이다 <span style="color:var(--muted)">(항목을 많이 보면 반드시 생깁니다)</span></li>
      </ol>
      <div class="ex"><b>현장 예시</b> — “야근이 많은 날 불량이 늘었다” → 야근이 원인일 수도 있지만,
        <b>납기가 급한 날</b>이라 야근도 하고 서두르다 불량도 난 것일 수 있습니다.</div>
      <div class="keybox"><b>기억할 것</b> — 상관관계는 <b>“여기를 더 파봐라”는 힌트</b>이지 결론이 아닙니다.</div>` },

  { id:'l3-3', title:'숨은 변수와 심슨의 역설 — 결론이 뒤집힙니다',
    body:`<p>가장 무서운 함정입니다. <b>전체로 보면 A가 나쁜데, 조건별로 나눠 보면 A가 모든 구간에서 좋은</b>
      경우가 실제로 생깁니다. 아래 버튼을 눌러 직접 확인해 보세요.</p>
      <div class="demo">
        <div class="demo-t">신형 설비 vs 구형 설비의 수율</div>
        <svg id="simpsonSvg" viewBox="0 0 600 250" role="img" aria-label="심슨의 역설 예시"></svg>
        <div class="ctl">
          <div class="seg" role="group" aria-label="보기 방식">
            <button type="button" id="simpAll" aria-pressed="true">전체로 보기</button>
            <button type="button" id="simpSplit" aria-pressed="false">온도별로 나눠 보기</button>
          </div>
          <span class="readout" id="simpOut"></span>
        </div>
      </div>
      <p>왜 이런 일이 생길까요? <b>신형 설비를 주로 어려운 고온 조건에 투입했기 때문</b>입니다.
      조건이 불리하니 성적이 나빠 보였을 뿐, 같은 온도에서 비교하면 신형이 더 좋습니다.</p>
      <div class="warnbox">⚠️ 이걸 모르고 “신형이 나쁘다”며 철수시키는 일이 현장에서 실제로 벌어집니다.
        <b>비교할 때는 항상 “두 그룹의 조건이 같았나?”를 먼저 물으세요.</b></div>`,
    try:[['confound_check','교란변수 점검 해보기']] },

  { id:'l3-4', title:'p값 — 무엇을 말하고, 무엇을 말하지 않는가',
    body:`<p>두 그룹의 평균이 다르게 나왔을 때, 그게 <b>진짜 차이인지 그냥 운인지</b> 판단하는 도구가
      p값입니다.</p>
      <p><b>p값 = 실제로는 차이가 없는데, 우연히 이만한 차이가 보일 확률.</b>
      보통 0.05(5%)보다 작으면 “우연으로 보기 어렵다 = 진짜 차이”로 판단합니다.</p>
      <div class="ex"><b>p = 0.03 의 뜻</b><br>
        ✅ “차이가 없는데 이런 결과가 나올 확률이 3%다” → 우연치고는 드무니 진짜 차이로 보자<br>
        ❌ “A가 옳을 확률이 97%다” (아님)<br>
        ❌ “차이가 크다” (아님 — <b>크기는 p값이 말해주지 않습니다</b>)</div>
      <p>데이터가 아주 많으면 <b>의미 없이 작은 차이도 p값이 작게</b> 나옵니다. 그래서 p값과 함께
      <b>차이의 크기</b>를 반드시 봐야 합니다. 수율이 0.01%p 차이라면 통계적으로 유의해도 현장에선 무의미합니다.</p>
      <div class="keybox"><b>기억할 것</b> — p값은 “<b>우연인가?</b>”에만 답합니다.
        “<b>중요한가?</b>”는 사람이 판단합니다.</div>`,
    try:[['compare_groups','그룹 차이 검정 해보기']] },
]},

{ id:'ch4', num:'4장', title:'시간을 읽는 눈',
  desc:'날짜가 있는 데이터는 규칙이 다릅니다. 시계열에서만 통하는 사고방식입니다.',
  lessons:[
  { id:'l4-1', title:'시계열은 세 조각으로 되어 있습니다',
    body:`<p>날짜별로 오르내리는 데이터는 보통 세 가지가 겹쳐 있습니다.</p>
      <ul>
        <li><b>추세</b> — 길게 보았을 때의 방향. 계속 늘고 있는지, 줄고 있는지.</li>
        <li><b>계절성</b> — 일정한 주기로 반복되는 패턴. 주말마다 낮아지는 것, 여름마다 높아지는 것.</li>
        <li><b>잡음</b> — 설명되지 않는 나머지 흔들림.</li>
      </ul>
      <p>이걸 분리해야 제대로 읽힙니다. “이번 주 매출이 지난주보다 낮다”가 나쁜 신호일까요?
      <b>원래 매주 그 요일이 낮다면</b> 아무 일도 아닙니다.</p>
      <div class="ex"><b>흔한 오해</b> — 전월 대비 감소를 보고 놀라는 경우. 2월은 날짜 수가 적어
        거의 항상 1월보다 낮습니다. <b>작년 같은 달과 비교</b>하는 것이 맞습니다.</div>`,
    try:[['ts_smooth','추세·계절 분리해 보기']] },

  { id:'l4-2', title:'예측이 “맞았다”는 것의 의미',
    body:`<p>예측은 하나의 숫자가 아니라 <b>범위</b>로 나옵니다. “다음 달 1,200개, 가능 범위 1,050~1,350”
      같은 식입니다. 이 범위가 넓다는 것은 <b>확신이 덜하다</b>는 뜻입니다.</p>
      <p>예측 정확도는 보통 <b>MAPE</b>(평균 오차율)로 봅니다. 과거 시점으로 돌아가 “그때 예측했다면
      얼마나 맞았을까”를 계산한 값입니다.</p>
      <div class="ex"><b>MAPE 읽는 법</b><br>
        · 10% 미만 — 매우 우수, 실무에 바로 쓸 만함<br>
        · 10~20% — 양호, 참고 지표로 충분<br>
        · 20~50% — 방향성 참고용<br>
        · 50% 이상 — 신뢰하기 어려움</div>
      <div class="keybox"><b>기억할 것</b> — 계획을 세울 때는 예측값 하나가 아니라

  return `<article class="lesson" id="${l.id}">
    <h3><span class="n">${idx}</span> ${esc(l.title)}</h3>

}

    });
    html += `</section>`;
    toc += `<li class="ch"><a href="#${ch.id}">${esc(ch.num)}. ${esc(ch.title)}</a>
      ${ls ? `<ul class="ls">${ls}</ul>` : ''}</li>`;
  });
  $('#content').innerHTML = html;
  $('#tocList').innerHTML = toc;
  const nCards = MODCARDS.reduce((s, g) => s + g.items.length, 0);
  $('#pillCount').textContent = `📘 ${CURRICULUM.length}개 장 · ${n}개 강의 · 기법 카드 ${nCards}장`;
  $('#pillTime').textContent = `⏱️ 약 ${Math.round(n * 2)}분`;

  $$('[data-done]').forEach(b => {
    const id = b.dataset.done;
    const set = on => {
      b.setAttribute('aria-pressed', String(on));
      b.textContent = on ? '✓ 읽음' : '읽음 표시';
      const t = $(`[data-toc="${id}"]`);
      if (t) t.classList.toggle('done', on);
    };
    set(DONE.has(id));
    b.addEventListener('click', () => {
      if (DONE.has(id)) DONE.delete(id); else DONE.add(id);
      set(DONE.has(id)); saveDone(); updateProgress();
    });
  });
  updateProgress();
}

function updateProgress(){
  const total = $$('[data-done]').length;
  const done = $$('[data-done]').filter(b => DONE.has(b.dataset.done)).length;
  $('#progFill').style.width = total ? `${done / total * 100}%` : '0';
  $('#progText').textContent = `${done} / ${total} 강의 완료`;
}

/* ═══════════════════════════════════════════════════════════════
   인터랙티브 예제
   ═══════════════════════════════════════════════════════════════ */
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ① 평균 vs 중앙값 */
const SALARY = [320, 340, 360, 380, 400, 420, 450, 480, 520];
function drawMean(){
  const svg = $('#meanSvg');
  if (!svg) return;
  const extra = Number($('#meanSlider').value);
  const vals = [...SALARY, extra].sort((a, b) => a - b);
  const mean = vals.reduce((s, v) => s + v, 0) / vals.length;
  const mid = (vals[4] + vals[5]) / 2;
  const W = 600, H = 190, P = 34, maxV = 5200;
  const x = v => P + (v / maxV) * (W - P * 2);
  svg.innerHTML = '';
  svg.appendChild(el('line', { x1:P, y1:H-42, x2:W-P, y2:H-42, stroke:css('--border-strong'), 'stroke-width':1 }));
  [0,1000,2000,3000,4000,5000].forEach(v => {
    svg.appendChild(el('line', { x1:x(v), y1:H-46, x2:x(v), y2:H-38, stroke:css('--muted'), 'stroke-width':1 }));
    const t = el('text', { x:x(v), y:H-24, 'text-anchor':'middle', 'font-size':11, fill:css('--muted') });
    t.textContent = v; svg.appendChild(t);
  });
  vals.forEach((v, i) => {
    const isExtra = v === extra && i === vals.indexOf(extra);
    svg.appendChild(el('circle', { cx:x(v), cy:H-42, r:isExtra ? 9 : 7,
      fill:isExtra ? css('--s2') : css('--s1'), opacity:isExtra ? 1 : .55,
      stroke:css('--surface'), 'stroke-width':2 }));
  });
  const mark = (v, color, label, dy) => {
    svg.appendChild(el('line', { x1:x(v), y1:22+dy, x2:x(v), y2:H-42, stroke:color, 'stroke-width':2 }));
    const t = el('text', { x:x(v), y:16+dy, 'text-anchor':'middle', 'font-size':12.5,
      'font-weight':700, fill:color });
    t.textContent = `${label} ${Math.round(v).toLocaleString()}`;
    svg.appendChild(t);
  };
  mark(mean, css('--s1'), '평균', 0);
  mark(mid, css('--s3'), '중앙값', 26);
  $('#meanOut').textContent = `${extra.toLocaleString()}만원 · 평균 ${Math.round(mean).toLocaleString()} / 중앙값 ${Math.round(mid).toLocaleString()}`;
}

/* ② 상관계수 */
let corrSeed = 12345;
function rnd(){ corrSeed = (corrSeed * 1103515245 + 12345) % 2147483648; return corrSeed / 2147483648; }
function gauss(){ let s = 0; for (let i = 0; i < 6; i++) s += rnd(); return (s - 3) / 1.1; }
function drawCorr(){
  const svg = $('#corrSvg');
  if (!svg) return;
  const r = Number($('#corrSlider').value) / 100;
  corrSeed = 12345;
  const W = 600, H = 260, P = 42;
  const pts = [];
  for (let i = 0; i < 90; i++){
    const a = gauss(), b = gauss();
    pts.push([a, r * a + Math.sqrt(Math.max(0, 1 - r * r)) * b]);
  }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const sx = [Math.min(...xs), Math.max(...xs)], sy = [Math.min(...ys), Math.max(...ys)];
  const X = v => P + (v - sx[0]) / (sx[1] - sx[0] || 1) * (W - P * 2);
  const Y = v => H - P - (v - sy[0]) / (sy[1] - sy[0] || 1) * (H - P * 2);
  svg.innerHTML = '';
  svg.appendChild(el('line', { x1:P, y1:H-P, x2:W-P, y2:H-P, stroke:css('--border-strong'), 'stroke-width':1 }));
  svg.appendChild(el('line', { x1:P, y1:P, x2:P, y2:H-P, stroke:css('--border-strong'), 'stroke-width':1 }));
  const lx = el('text', { x:W/2, y:H-14, 'text-anchor':'middle', 'font-size':12, fill:css('--muted') });
  lx.textContent = '설비온도 →'; svg.appendChild(lx);
  const ly = el('text', { x:14, y:H/2, 'text-anchor':'middle', 'font-size':12, fill:css('--muted'),
    transform:`rotate(-90 14 ${H/2})` });
  ly.textContent = '불량률 →'; svg.appendChild(ly);
  pts.forEach(([a, b]) => svg.appendChild(el('circle', { cx:X(a), cy:Y(b), r:5,
    fill:css('--s1'), opacity:.5, stroke:css('--surface'), 'stroke-width':1.5 })));
  if (Math.abs(r) > 0.08){
    svg.appendChild(el('line', { x1:X(sx[0]), y1:Y(r * sx[0]), x2:X(sx[1]), y2:Y(r * sx[1]),
      stroke:css('--s8'), 'stroke-width':2 }));
  }
  const word = Math.abs(r) >= 0.7 ? '강한 관계' : Math.abs(r) >= 0.4 ? '뚜렷한 관계'
             : Math.abs(r) >= 0.2 ? '약한 관계' : '거의 관계 없음';
  const dir = r > 0.08 ? '같이 오름' : r < -0.08 ? '반대로 움직임' : '';
  $('#corrOut').textContent = `r = ${r.toFixed(2)} · ${word}${dir ? ' · ' + dir : ''}`;
}

/* ③ 심슨의 역설 */
let simpSplit = false;
function drawSimpson(){
  const svg = $('#simpsonSvg');
  if (!svg) return;
  const W = 600, H = 250, P = 46;
  svg.innerHTML = '';
  const bar = (x, y, w, h, color, label, val) => {
    svg.appendChild(el('rect', { x, y, width:w, height:h, fill:color, rx:4 }));
    const t = el('text', { x:x + w/2, y:y - 8, 'text-anchor':'middle', 'font-size':12.5,
      'font-weight':700, fill:css('--text') });
    t.textContent = val; svg.appendChild(t);
    const l = el('text', { x:x + w/2, y:H - 22, 'text-anchor':'middle', 'font-size':11.5, fill:css('--muted') });
    l.textContent = label; svg.appendChild(l);
  };
  const scale = v => (v - 88) / 10 * (H - P - 40);
  svg.appendChild(el('line', { x1:P-10, y1:H-40, x2:W-P+10, y2:H-40,
    stroke:css('--border-strong'), 'stroke-width':1 }));

  if (!simpSplit){
    bar(140, H - 40 - scale(94.4), 90, scale(94.4), css('--s1'), '구형 설비', '94.4');
    bar(370, H - 40 - scale(92.9), 90, scale(92.9), css('--s2'), '신형 설비', '92.9');
    const t = el('text', { x:W/2, y:26, 'text-anchor':'middle', 'font-size':13.5,
      'font-weight':700, fill:css('--s8') });
    t.textContent = '전체로 보면 → 신형이 1.5%p 낮음 (신형이 나빠 보임)';
    svg.appendChild(t);
    $('#simpOut').textContent = '결론: 신형이 나쁘다?';
  } else {
    const groups = [['저온', 96.6, 97.1], ['중온', 94.3, 96.2], ['고온', 91.0, 92.7]];
    groups.forEach(([name, oldV, newV], i) => {
      const x0 = 90 + i * 165;
      bar(x0, H - 40 - scale(oldV), 52, scale(oldV), css('--s1'), '', oldV.toFixed(1));
      bar(x0 + 58, H - 40 - scale(newV), 52, scale(newV), css('--s2'), '', newV.toFixed(1));
      const l = el('text', { x:x0 + 55, y:H - 22, 'text-anchor':'middle', 'font-size':11.5,
        fill:css('--muted') });
      l.textContent = name + ' 구간'; svg.appendChild(l);
    });
    const t = el('text', { x:W/2, y:26, 'text-anchor':'middle', 'font-size':13.5,
      'font-weight':700, fill:css('--s3') });
    t.textContent = '온도별로 나누면 → 모든 구간에서 신형이 더 높음';
    svg.appendChild(t);
    $('#simpOut').textContent = '결론: 신형이 좋다!';
  }
  const legend = [['구형 설비', css('--s1')], ['신형 설비', css('--s2')]];
  legend.forEach(([name, color], i) => {
    svg.appendChild(el('rect', { x:W - 150 + i * 0, y:44 + i * 20, width:11, height:11, fill:color, rx:2 }));
    const t = el('text', { x:W - 134, y:54 + i * 20, 'font-size':11.5, fill:css('--text-2') });
    t.textContent = name; svg.appendChild(t);
  });
}

/* ═══════════════════════════════════════════════════════════════
   초기화
   ═══════════════════════════════════════════════════════════════ */
render();
$('#meanSlider').addEventListener('input', drawMean);
$('#corrSlider').addEventListener('input', drawCorr);
$('#simpAll').addEventListener('click', () => {
  simpSplit = false; $('#simpAll').setAttribute('aria-pressed','true');
  $('#simpSplit').setAttribute('aria-pressed','false'); drawSimpson();
});
$('#simpSplit').addEventListener('click', () => {
  simpSplit = true; $('#simpAll').setAttribute('aria-pressed','false');
  $('#simpSplit').setAttribute('aria-pressed','true'); drawSimpson();
});
drawMean(); drawCorr(); drawSimpson();

$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('dap_theme', next); }catch(_){}
  drawMean(); drawCorr(); drawSimpson();
});
try{
  const saved = localStorage.getItem('dap_theme');
  if (saved){ document.documentElement.setAttribute('data-theme', saved); drawMean(); drawCorr(); drawSimpson(); }
}catch(_){}
</script>
